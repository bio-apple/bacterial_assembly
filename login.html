<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F7F8">
  <title>登录 · 静态预览</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/demo.css">
</head>
<body class="login-page">
  <div class="demo-banner" role="note">
    <span><strong>静态预览</strong> · 不校验账号；点按钮仅跳转界面示意</span>
    <span><a href="index.html">项目页</a></span>
  </div>
  <main id="main-content" class="login-shell">
    <a class="brand login-brand" href="overview.html">
      <span class="brand-icon" aria-hidden="true">MN<i></i></span>
      <span>MICROBIAL <b>NGS</b></span>
    </a>
    <p class="eyebrow">MICROBIAL NGS / DATA ANALYSIS</p>
    <h1>微生物&nbsp;NGS<br>数据分析系统</h1>
    <p class="login-copy">科研工作台登录界面示意。正式部署使用预配置实验室账号。</p>
    <form class="login-form" action="overview.html" method="get">
      <label for="username">账号</label>
      <input id="username" name="username" value="demo" required>
      <label for="password">密码</label>
      <div class="password-field">
        <input id="password" name="password" type="password" value="demo" required>
      </div>
      <button class="button button-primary" type="submit">进入预览工作台 <span>↗</span></button>
    </form>
    <p class="login-foot">静态预览不会发起认证请求</p>
  </main>
  <div class="login-aside" aria-hidden="true">
    <div class="login-figure">
      <p class="eyebrow">WORKFLOWS</p>
      <div class="login-flow"><span>READS</span><i></i><span>MODULE</span><i></i><span>RESULTS</span></div>
      <p>Paired reads enter<br><strong>purpose-built analysis.</strong></p>
    </div>
  </div>
</body>
</html>
