<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F7FB">
  <title>任务监控 · 静态预览</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/demo.css">
</head>
<body class="workbench">
  <div class="demo-banner" role="note">
    <span><strong>静态预览</strong> · GitHub Pages 展示界面，无后端、不可上传/提交/轮询</span>
    <span><a href="index.html">项目页</a> · <a href="https://github.com/bio-apple/bacterial_assembly">仓库</a></span>
  </div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand sidebar-brand" href="overview.html">
        <span class="brand-icon" aria-hidden="true">MN<i></i></span>
        <span>MICROBIAL <b>NGS</b></span>
      </a>
      <nav class="sidebar-nav">
      <a class="sidebar-link" href="overview.html">总览</a>
      <a class="sidebar-link" href="modules.html">分析模块</a>
      <a class="sidebar-link" href="dashboard.html">组装工作台</a>
      <a class="sidebar-link is-active" href="history.html" aria-current="page">处理历史</a>
      </nav>
      <p class="sidebar-foot">STATIC PREVIEW</p>
    </aside>
    <header class="topbar">
      <div class="topbar-right">
        <span class="system-state"><i></i> 静态演示</span>
        <span class="user-tag">demo</span>
        <a class="text-button" href="login.html">退出</a>
      </div>
    </header>

    <main id="main-content" class="dashboard monitor-page">
      <header class="monitor-intro">
        <div>
          <p class="eyebrow">LIVE TASK / PREVIEW</p>
          <p class="monitor-sample">界面示意 · 无实时轮询</p>
          <h1>阶段流水线</h1>
        </div>
        <a class="monitor-back" href="dashboard.html">返回工作台</a>
      </header>
      <p class="report-note">静态预览不连接任务 API。真实进度、日志与取消请使用宿主机 Web。</p>
      <div class="monitor-layout">
        <div class="monitor-main">
          <section class="panel" style="padding:18px">
            <h2>阶段</h2>
            <ol class="stage-rail">
              <li class="stage-method state-waiting"><span class="stage-node"></span><div><div class="stage-method-head"><strong>质控 / 组装 / 评估</strong><span class="stage-state">示意</span></div></div></li>
            </ol>
          </section>
        </div>
        <aside class="monitor-side">
          <section class="panel" style="padding:18px">
            <h2>操作</h2>
            <p class="empty-state">取消、下载、重跑在静态页不可用。</p>
            <a class="button" href="report.html">查看报告示意</a>
          </section>
        </aside>
      </div>
    </main>

  </div>
</body>
</html>
