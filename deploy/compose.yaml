services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assembly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-assembly}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # Host 5433 avoids clashing with a local Postgres on 5432.
      - 127.0.0.1:5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assembly} -d ${POSTGRES_DB:-assembly}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      # Host 6380 avoids clashing with a local Redis on 6379.
      - 127.0.0.1:6380:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    # Prefer ./deploy/build.sh (resolves platform per ADR 0019).
    # Do not hardcode platform here.
    build:
      context: ..
    image: bacterial-assembly:latest
    entrypoint: ["micromamba", "run", "-n", "base"]
    command:
      - gunicorn
      - --workers
      - "2"
      - --timeout
      - "3600"
      - --bind
      - 0.0.0.0:8000
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - web.app:app
    working_dir: /opt/bacterial-assembly
    environment:
      ASSEMBLY_WEB_SECRET: ${ASSEMBLY_WEB_SECRET:?Set a unique random secret in deploy/.env}
      ASSEMBLY_SESSION_COOKIE_SECURE: ${ASSEMBLY_SESSION_COOKIE_SECURE:-true}
      ASSEMBLY_USERS_FILE: /config/users.json
      ASSEMBLY_DATA_ROOT: /data
      TMPDIR: /data/temp
      PYTHONPATH: /opt/bacterial-assembly
      DATABASE_URL: ${DATABASE_URL:-postgresql://assembly:${POSTGRES_PASSWORD}@postgres:5432/assembly}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TASK_BACKEND: ${TASK_BACKEND:-postgres_rq}
      ASSEMBLY_SQLITE_PATH: /data/database/jobs.sqlite3
    volumes:
      - ..:/opt/bacterial-assembly:ro
      - ./data:/data
      - ./users.json:/config/users.json:ro
    ports:
      - 127.0.0.1:8000:8000
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Legacy single-process pipeline worker (SQLite FIFO). Keep until Flask jobs move to RQ.
  worker-legacy:
    image: bacterial-assembly:latest
    container_name: bacterial-assembly-worker-legacy
    profiles: ["legacy-worker"]
    entrypoint: ["micromamba", "run", "-n", "base"]
    command: ["python", "-m", "web.worker"]
    working_dir: /opt/bacterial-assembly
    environment:
      ASSEMBLY_WEB_SECRET: ${ASSEMBLY_WEB_SECRET:?Set a unique random secret in deploy/.env}
      ASSEMBLY_USERS_FILE: /config/users.json
      ASSEMBLY_DATA_ROOT: /data
      TMPDIR: /data/temp
      PYTHONPATH: /opt/bacterial-assembly
      TOOL_RUNTIME: ${TOOL_RUNTIME:-docker}
    volumes:
      - ..:/opt/bacterial-assembly:ro
      - ./data:/data
      - ./users.json:/config/users.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - ${DOCKER_GID:-0}
    restart: unless-stopped
    init: true

  worker-assembly:
    image: bacterial-assembly:latest
    container_name: bacterial-assembly-worker-assembly
    entrypoint: ["micromamba", "run", "-n", "base"]
    command: ["python", "-m", "web.rq_worker", "assembly"]
    working_dir: /opt/bacterial-assembly
    environment:
      ASSEMBLY_DATA_ROOT: /data
      TMPDIR: /data/temp
      PYTHONPATH: /opt/bacterial-assembly
      TOOL_RUNTIME: ${TOOL_RUNTIME:-docker}
      DATABASE_URL: ${DATABASE_URL:-postgresql://assembly:${POSTGRES_PASSWORD}@postgres:5432/assembly}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TASK_BACKEND: ${TASK_BACKEND:-postgres_rq}
      ASSEMBLY_SQLITE_PATH: /data/database/jobs.sqlite3
    volumes:
      - ..:/opt/bacterial-assembly:ro
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - ${DOCKER_GID:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true

  worker-qc:
    image: bacterial-assembly:latest
    container_name: bacterial-assembly-worker-qc
    entrypoint: ["micromamba", "run", "-n", "base"]
    command: ["python", "-m", "web.rq_worker", "qc"]
    working_dir: /opt/bacterial-assembly
    environment:
      ASSEMBLY_DATA_ROOT: /data
      TMPDIR: /data/temp
      PYTHONPATH: /opt/bacterial-assembly
      TOOL_RUNTIME: ${TOOL_RUNTIME:-docker}
      DATABASE_URL: ${DATABASE_URL:-postgresql://assembly:${POSTGRES_PASSWORD}@postgres:5432/assembly}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TASK_BACKEND: ${TASK_BACKEND:-postgres_rq}
      ASSEMBLY_SQLITE_PATH: /data/database/jobs.sqlite3
    volumes:
      - ..:/opt/bacterial-assembly:ro
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - ${DOCKER_GID:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
