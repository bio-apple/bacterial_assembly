# Whitelist of bioinformatics tools runnable via TOOL_RUNTIME=docker.
# Users cannot override image names or mounts.
# Images use :latest; conda packages are unpinned at build time (ADR 0010).
tools:
  fastp:
    image: bacterial-assembly-fastp:latest
    executables:
      - fastp
  spades:
    image: bacterial-assembly-spades:latest
    executables:
      - spades.py
  unicycler:
    image: bacterial-assembly-unicycler:latest
    bundled_spades_label: bundled in bacterial-assembly-unicycler:latest
    executables:
      - unicycler
  shovill:
    image: bacterial-assembly-shovill:latest
    executables:
      - shovill
  megahit:
    image: bacterial-assembly-megahit:latest
    executables:
      - megahit
  quast:
    image: bacterial-assembly-quast:latest
    executables:
      - quast.py
