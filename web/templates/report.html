<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include "_head_meta.html" %}
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{{ report.sample_name }} · 分析报告 · 微生物 NGS 数据分析系统</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="workbench">
  {% include "_topbar.html" %}
  <main id="main-content" class="dashboard monitor-page">
    <header class="monitor-intro">
      <div>
        <p class="eyebrow">REPORT / HTML</p>
        <h1>{{ report.sample_name }}</h1>
        <p class="monitor-sample">{{ report.status_label }} · HTML 报告。PDF 未提供。</p>
      </div>
      <a class="monitor-back" href="{{ url_for('job_page', job_id=job.id) }}">返回任务</a>
    </header>
    <p class="report-links">
      <a href="{{ url_for('download_job_report', job_id=job.id, kind='html') }}">下载 HTML</a>
      <a href="{{ url_for('download_job_report', job_id=job.id, kind='tsv') }}">下载 TSV</a>
    </p>
    {% include "report_body.html" %}
  </main>
</body>
</html>
