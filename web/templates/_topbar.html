<a class="skip-link" href="#main-content">跳到主要内容</a>
<header class="topbar">
  <a class="brand" href="{{ url_for('overview') }}" aria-label="微生物 NGS 数据分析系统首页">
    <span class="brand-icon" aria-hidden="true">MN<i></i></span>
    <span>MICROBIAL <b>NGS</b></span>
  </a>
  <nav class="site-nav" aria-label="主要导航">
    <a class="site-nav-link{% if active_page == 'overview' %} is-active{% endif %}"
       href="{{ url_for('overview') }}"{% if active_page == 'overview' %} aria-current="page"{% endif %}>
      <span class="nav-full">总览</span><span class="nav-short">总览</span>
    </a>
    <a class="site-nav-link{% if active_page == 'modules' %} is-active{% endif %}"
       href="{{ url_for('module_index') }}"{% if active_page == 'modules' %} aria-current="page"{% endif %}>
      <span class="nav-full">分析模块</span><span class="nav-short">模块</span>
    </a>
    <a class="site-nav-link{% if active_page == 'history' %} is-active{% endif %}"
       href="{{ url_for('job_history') }}"{% if active_page == 'history' %} aria-current="page"{% endif %}>
      <span class="nav-full">处理历史</span><span class="nav-short">历史</span>
    </a>
  </nav>
  <div class="topbar-right">
    <div class="notice-slip" data-notice-root>
      <button type="button" class="notice-slip-toggle" aria-expanded="false" aria-controls="lab-notice-sheet" aria-label="实验室通知">
        <span class="notice-slip-kicker">实验室通知</span>
        <span class="notice-slip-line" data-notice-line aria-live="polite">暂无任务动态</span>
        <span class="notice-slip-count" data-notice-count aria-live="polite" hidden></span>
        <i class="notice-dot" data-notice-dot hidden></i>
      </button>
      <div id="lab-notice-sheet" class="notice-sheet" role="region" aria-label="通知列表" tabindex="-1" hidden>
        <ol data-notice-items></ol>
      </div>
    </div>
    <span class="system-state"><i></i> Linux 工作节点</span>
    <span class="user-tag">{{ username }}</span>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="text-button" type="submit">退出</button>
    </form>
  </div>
</header>
<script src="{{ url_for('static', filename='notices.js') }}" defer></script>
