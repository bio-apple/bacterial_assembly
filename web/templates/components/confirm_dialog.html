<dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-dialog-title">
  <form method="dialog" class="confirm-dialog-form">
    <h2 id="confirm-dialog-title"></h2>
    <p id="confirm-dialog-copy"></p>
    <div class="confirm-dialog-actions">
      <button type="submit" class="text-button" value="cancel">返回</button>
      <button type="submit" class="button" id="confirm-dialog-accept" value="confirm"></button>
    </div>
  </form>
</dialog>
